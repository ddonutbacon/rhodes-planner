<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;background:transparent">
<script>
const READY="streamlit:componentReady";
const RENDER="streamlit:render";
const VALUE="streamlit:setComponentValue";
const HEIGHT="streamlit:setFrameHeight";
let lastToken=null;
function send(type,data){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},data),"*")}
function emit(value){send(VALUE,{value:value,dataType:"json"})}
window.addEventListener("message",e=>{
  if(!e.data||e.data.type!==RENDER)return;
  const a=e.data.args||{};
  const token=`${a.command}|${a.storage_key}|${a.nonce}`;
  if(token===lastToken)return;
  lastToken=token;
  try{
    if(a.command==="load"){
      const raw=localStorage.getItem(a.storage_key);
      let profile={};
      if(raw){ profile=JSON.parse(raw); }
      emit({status:"loaded",found:!!raw,profile:profile,nonce:a.nonce});
    } else if(a.command==="save"){
      localStorage.setItem(a.storage_key,JSON.stringify(a.payload||{}));
      emit({status:"saved",nonce:a.nonce});
    } else if(a.command==="clear"){
      localStorage.removeItem(a.storage_key);
      emit({status:"cleared",nonce:a.nonce});
    }
  }catch(err){
    emit({status:"error",message:String(err),nonce:a.nonce});
  }
  send(HEIGHT,{height:1});
});
send(READY,{apiVersion:1});
send(HEIGHT,{height:1});
</script>
</body>
</html>
