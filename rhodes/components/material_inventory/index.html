<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  color-scheme: dark;
  --bg: #0e1117;
  --panel: #151922;
  --panel-hover: #1a202a;
  --border: #5b616b;
  --muted: #9aa4b2;
  --text: #f5f7fa;
  --accent: #1675e8;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.wrap { padding: 2px; }
.search {
  width: 100%;
  height: 42px;
  border: 1px solid #414854;
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  padding: 0 12px;
  font-size: 14px;
  outline: none;
  margin-bottom: 8px;
}
.search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.meta {
  color: var(--muted);
  font-size: 12px;
  margin: 0 2px 8px 2px;
}
.scrollbox {
  height: 610px;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 5px;
}
.scrollbox::-webkit-scrollbar { width: 10px; }
.scrollbox::-webkit-scrollbar-thumb {
  background: #3c4553;
  border-radius: 8px;
}
.grid {
  display: grid;
  gap: 10px;
}
.card {
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--panel);
  padding: 7px;
}
.name {
  height: 31px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1px 4px 6px 4px;
  text-align: center;
  font-size: 11px;
  line-height: 1.15;
  font-weight: 650;
  overflow: hidden;
}
.imagebox {
  height: 96px;
  border-top: 1px solid #707781;
  border-bottom: 1px solid #707781;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #3a3a3a;
  overflow: hidden;
}
.imagebox img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
}
.qty {
  width: 100%;
  height: 32px;
  margin-top: 7px;
  border-radius: 4px;
  border: 1px solid #555d68;
  background: #10141b;
  color: #fff;
  padding: 0 8px;
  font-size: 13px;
  font-weight: 600;
  outline: none;
}
.qty:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.empty {
  padding: 20px 3px;
  color: var(--muted);
}
@media (max-width: 1050px) {
  .grid { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
}
@media (max-width: 850px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
}
@media (max-width: 650px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <input id="search" class="search" type="text" autocomplete="off" />
  <div id="meta" class="meta"></div>
  <div class="scrollbox">
    <div id="grid" class="grid"></div>
  </div>
</div>

<script>
const READY = "streamlit:componentReady";
const RENDER = "streamlit:render";
const VALUE = "streamlit:setComponentValue";
const HEIGHT = "streamlit:setFrameHeight";

let props = {items: [], columns: 6, placeholder: "Search inventory…"};
let query = "";

function send(type, data) {
  window.parent.postMessage(Object.assign({
    isStreamlitMessage: true,
    type: type
  }, data), "*");
}

function setValue(value) {
  send(VALUE, {value: value, dataType: "json"});
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function visibleItems() {
  const q = query.trim().toLowerCase();
  if (!q) return props.items || [];
  return (props.items || []).filter(item =>
    String(item.search || item.name || "").toLowerCase().includes(q)
  );
}

function commit(input) {
  const id = input.dataset.id;
  let value = Number.parseInt(input.value || "0", 10);
  if (!Number.isFinite(value) || value < 0) value = 0;
  input.value = String(value);

  const item = (props.items || []).find(x => String(x.id) === String(id));
  if (item) item.quantity = value;

  setValue({id: id, quantity: value});
}

function render() {
  const search = document.getElementById("search");
  const grid = document.getElementById("grid");
  const meta = document.getElementById("meta");

  search.placeholder = props.placeholder || "Search inventory…";
  grid.style.gridTemplateColumns =
    `repeat(${Math.max(1, Math.min(6, Number(props.columns) || 6))}, minmax(0,1fr))`;

  const items = visibleItems();
  meta.textContent = `${items.length} item${items.length === 1 ? "" : "s"} shown`;

  if (!items.length) {
    grid.innerHTML = `<div class="empty">No items match that search.</div>`;
    return;
  }

  grid.innerHTML = items.map(item => `
    <div class="card">
      <div class="name" title="${esc(item.name)}">${esc(item.name)}</div>
      <div class="imagebox">
        <img loading="lazy" src="${esc(item.image)}" alt="${esc(item.name)}">
      </div>
      <input
        class="qty"
        type="number"
        min="0"
        step="1"
        value="${Number(item.quantity) || 0}"
        data-id="${esc(item.id)}"
        aria-label="${esc(item.name)} owned quantity"
      >
    </div>
  `).join("");

  grid.querySelectorAll(".qty").forEach(input => {
    input.addEventListener("change", () => commit(input));
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        input.blur();
      }
    });
  });
}

document.getElementById("search").addEventListener("input", event => {
  query = event.target.value || "";
  render();
});

window.addEventListener("message", event => {
  if (!event.data || event.data.type !== RENDER) return;
  props = Object.assign(props, event.data.args || {});
  render();
});

send(READY, {apiVersion: 1});
send(HEIGHT, {height: 690});
</script>
</body>
</html>
