<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  color-scheme: dark;
  --bg: #0e1117;
  --panel: #141922;
  --panel2: #11151d;
  --border: #343b47;
  --muted: #9aa4b2;
  --text: #f4f6f8;
  --accent: #2f80ed;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.wrap { padding: 2px 2px 10px 2px; }
.filters { display:grid; grid-template-columns: 2.2fr 1fr 1.25fr; gap:8px; }
.search {
  width: 100%; height: 42px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); padding: 0 12px; outline: none; font-size: 15px;
}
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.select { height:42px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); padding:0 9px; outline:none; }
.scrollbox { height:520px; overflow-y:auto; overflow-x:hidden; padding-right:4px; border-top:1px solid transparent; }
.scrollbox::-webkit-scrollbar { width:10px; }
.scrollbox::-webkit-scrollbar-thumb { background:#394252; border-radius:8px; }

.meta { font-size: 12px; color: var(--muted); margin: 7px 2px 9px 2px; }
.grid { display: grid; gap: 10px; }
.card {
  border: 1px solid var(--border); background: var(--panel2); border-radius: 10px;
  overflow: hidden; cursor: pointer; padding: 0; color: inherit; text-align: left;
  transition: transform .08s ease, border-color .08s ease, background .08s ease;
}
.card:hover { transform: translateY(-1px); border-color: #677181; background: var(--panel); }
.card.selected { border: 2px solid var(--accent); background: #14213a; }
.imgwrap { aspect-ratio: 1 / 1; overflow: hidden; background: #090c11; }
.imgwrap img { display:block; width:100%; height:100%; object-fit:cover; }
.info { padding: 8px 9px 10px 9px; }
.name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 10px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.empty { padding: 18px 4px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="filters">
    <input id="search" class="search" type="text" autocomplete="off" />
    <select id="class-filter" class="select"><option value="">All classes</option></select>
    <select id="subclass-filter" class="select"><option value="">All sub-classes</option></select>
  </div>
  <div id="meta" class="meta"></div>
  <div class="scrollbox">
    <div id="grid" class="grid"></div>
  </div>
</div>
<script>
const SET_COMPONENT_VALUE = "streamlit:setComponentValue";
const RENDER = "streamlit:render";
const COMPONENT_READY = "streamlit:componentReady";
const SET_FRAME_HEIGHT = "streamlit:setFrameHeight";

let props = {operators: [], selected_id: "", columns: 5, placeholder: "Search operator…"};
let query = "";
let selectedClass = "";
let selectedSubclass = "";

function send(type, data) {
  window.parent.postMessage(Object.assign({
    isStreamlitMessage: true,
    type: type,
  }, data), "*");
}
function setFrameHeight() {
  const h = 620;
  send(SET_FRAME_HEIGHT, {height: h});
}
function setValue(value) {
  send(SET_COMPONENT_VALUE, {value: value, dataType: "json"});
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function uniqueSorted(values) {
  return [...new Set(values.filter(Boolean))].sort((a,b) => a.localeCompare(b));
}
function rebuildClassOptions() {
  const select = document.getElementById("class-filter");
  const values = uniqueSorted((props.operators || []).map(op => op.class_name || ""));
  select.innerHTML = `<option value="">All classes</option>` +
    values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  if (values.includes(selectedClass)) select.value = selectedClass;
}
function rebuildSubclassOptions() {
  const select = document.getElementById("subclass-filter");
  const source = (props.operators || []).filter(op => !selectedClass || op.class_name === selectedClass);
  const values = uniqueSorted(source.map(op => op.subclass_name || ""));
  select.innerHTML = `<option value="">All sub-classes</option>` +
    values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  if (values.includes(selectedSubclass)) {
    select.value = selectedSubclass;
  } else {
    selectedSubclass = "";
    select.value = "";
  }
}
function render() {
  const search = document.getElementById("search");
  const grid = document.getElementById("grid");
  const meta = document.getElementById("meta");
  search.placeholder = props.placeholder || "Search operator…";
  grid.style.gridTemplateColumns = `repeat(${Math.max(1, Math.min(5, Number(props.columns)||5))}, minmax(0,1fr))`;

  const q = query.trim().toLowerCase();
  const visible = (props.operators || []).filter(op => {
    if (selectedClass && String(op.class_name || "") !== selectedClass) return false;
    if (selectedSubclass && String(op.subclass_name || "") !== selectedSubclass) return false;
    if (!q) return true;
    return String(op.search || "").toLowerCase().includes(q);
  });

  meta.textContent = `${visible.length} operator${visible.length === 1 ? "" : "s"} shown`;

  if (!visible.length) {
    grid.innerHTML = `<div class="empty">No operator matches that search.</div>`;
    setTimeout(setFrameHeight, 0);
    return;
  }

  grid.innerHTML = visible.map(op => `
    <button class="card ${String(op.id) === String(props.selected_id) ? "selected" : ""}"
            data-id="${esc(op.id)}" title="${esc(op.name)}">
      <div class="imgwrap"><img loading="lazy" src="${esc(op.image)}" alt="${esc(op.name)}"></div>
      <div class="info">
        <div class="name">${esc(op.name)}</div>
        <div class="sub">${"★".repeat(Number(op.rarity)||0)} · ${op.owned ? "Owned" : "Not owned"} · ${esc(op.class_name || "")}<br>${esc(op.subclass_name || "")} · ${esc(op.availability || "")}</div>
      </div>
    </button>
  `).join("");

  grid.querySelectorAll(".card").forEach(btn => {
    btn.addEventListener("click", () => {
      props.selected_id = btn.dataset.id;
      setValue(btn.dataset.id);
      render();
    });
  });
  setTimeout(setFrameHeight, 0);
}

document.getElementById("search").addEventListener("input", e => {
  query = e.target.value || "";
  render();
});
document.getElementById("class-filter").addEventListener("change", e => {
  selectedClass = e.target.value || "";
  rebuildSubclassOptions();
  render();
});
document.getElementById("subclass-filter").addEventListener("change", e => {
  selectedSubclass = e.target.value || "";
  render();
});

window.addEventListener("message", event => {
  if (!event.data || event.data.type !== RENDER) return;
  props = Object.assign(props, event.data.args || {});
  rebuildClassOptions();
  rebuildSubclassOptions();
  render();
});

send(COMPONENT_READY, {apiVersion: 1});
setTimeout(setFrameHeight, 0);
</script>
</body>
</html>
